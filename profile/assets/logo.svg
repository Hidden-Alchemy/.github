<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0B0A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#BD9C61" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B0B0A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#BD9C61" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#BD9C61" stop-opacity="0"/>
