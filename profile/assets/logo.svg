  <path d="M870 30 H830 M870 30 V70" stroke="#2A2925" stroke-width="1.5" fill="none"/>
  <path d="M30 250 H70 M30 250 V210" stroke="#2A2925" stroke-width="1.5" fill="none"/>
  <path d="M870 250 H830 M870 250 V210" stroke="#2A2925" stroke-width="1.5" fill="none"/>

  <!-- alembic / diamond emblem -->
  <g transform="translate(450,95)">
    <polygon points="0,-46 42,-8 26,48 -26,48 -42,-8" fill="none" stroke="#BD9C61" stroke-width="1.75"/>
    <polygon points="0,-30 26,-5 16,30 -16,30 -26,-5" fill="none" stroke="#D7BF91" stroke-width="1" opacity="0.55"/>
    <circle cx="0" cy="6" r="4.5" fill="#BD9C61"/>
    <line x1="0" y1="-46" x2="0" y2="-64" stroke="#BD9C61" stroke-width="1.75"/>
    <circle cx="0" cy="-70" r="4" fill="#BD9C61"/>
    <line x1="-42" y1="-8" x2="-58" y2="-8" stroke="#77736A" stroke-width="1"/>
    <line x1="42" y1="-8" x2="58" y2="-8" stroke="#77736A" stroke-width="1"/>
  </g>

  <line x1="260" y1="175" x2="640" y2="175" stroke="url(#goldFade)" stroke-width="1"/>

  <text x="450" y="210" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="36" letter-spacing="7" fill="#F3F0E8" font-weight="600">HIDDEN ALCHEMY</text>
  <text x="450" y="238" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="4" fill="#BD9C61">WHERE IDEAS BECOME SYSTEMS</text>
