name: Bug Report
description: Report a defect in an existing Hidden Alchemy system.
title: "[Bug]: "
labels:
  - type:bug
  - status:triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. One thing per issue — if you found several problems, open one issue each so each can be tracked to completion.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken? One or two sentences.
      placeholder: "e.g. The pipeline diagram link 404s instead of rendering."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, from a clean state. Include the URL or the exact context.
      placeholder: "1. Go to …\n2. Click …\n3. See error"
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What did you expect to happen, and what actually happened?
      placeholder: "Expected: the diagram renders. Actual: a broken image icon."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Repo / version
      description: Which repository and, if known, which version or commit.
      placeholder: "Hidden-Alchemy/.github @ main"
    validations:
      required: true