<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" role="img" font-family="'Inter',-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>Hidden Alchemy contribution pathway — Explore to Membership eligibility, entirely public until the last step</title>
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 H0 V46" fill="none" stroke="#151b23" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E3C080"/>
      <stop offset="1" stop-color="#BD9C61"/>
    </linearGradient>
    <linearGradient id="verd" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7FB39B"/>
      <stop offset="1" stop-color="#4C6B5C"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="rgba(189,156,97,0.12)"/>
      <stop offset="1" stop-color="rgba(189,156,97,0)"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="800" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="800" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="800" fill="url(#wash)"/>

  <path d="M120 710 H250" fill="none" stroke="#2d343c" stroke-width="3" stroke-dasharray="4 9" stroke-linejoin="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <path d="M250 710 L650 630 L250 550 L650 470 L250 390 L650 310 L250 230"
        fill="none" stroke="#21262d" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M250 390 L650 310 L250 230"
        fill="none" stroke="url(#gold)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="2s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#glow)">
    <circle r="7.5" fill="#E3C080"><animateMotion dur="14s" repeatCount="indefinite"
      path="M120 710 L250 710 L650 630 L250 550 L650 470 L250 390 L650 310 L250 230"/></circle>
    <circle r="6" fill="#6E9E87"><animateMotion dur="14s" begin="7s" repeatCount="indefinite"
      path="M120 710 L250 710 L650 630 L250 550 L650 470 L250 390 L650 310 L250 230"/></circle>
  </g>

  <circle cx="250" cy="230" r="34" fill="none" stroke="#E3C080" stroke-width="2">
    <animate attributeName="opacity" values="0.2;0.75;0.2" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 250 230" to="360 250 230" dur="9s" repeatCount="indefinite"/>
    <circle cx="250" cy="196" r="3" fill="#E3C080"/>
    <circle cx="250" cy="264" r="3" fill="#6E9E87"/>
  </g>
  <path d="M250 222 l3.4 6.4 7 .8 -5.1 5 1.3 7 -6.6-3.6 -6.6 3.6 1.3-7 -5.1-5 7-.8 Z" fill="url(#gold)">
    <animateTransform attributeName="transform" type="rotate" from="0 250 230" to="360 250 230" dur="16s" repeatCount="indefinite"/>
  </path>
  <circle cx="250" cy="222" r="20" fill="none" stroke="rgba(189,156,97,0.4)" stroke-width="1.5"/>

  <circle cx="650" cy="310" r="20" fill="#0d1117" stroke="#3c454e" stroke-width="2.5"/>
  <circle cx="650" cy="310" r="24" fill="none" stroke="#6E9E87" stroke-width="2">
    <animate attributeName="opacity" values="0.25;0.75;0.25" dur="2.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="250" cy="710" r="19" fill="#0d1117" stroke="#3c454e" stroke-width="2.5"/>
  <circle cx="650" cy="630" r="19" fill="#0d1117" stroke="#3c454e" stroke-width="2.5"/>
  <circle cx="250" cy="550" r="19" fill="#0d1117" stroke="#3c454e" stroke-width="2.5"/>
  <circle cx="650" cy="470" r="19" fill="#0d1117" stroke="#3c454e" stroke-width="2.5"/>
  <circle cx="250" cy="390" r="19" fill="url(#gold)" stroke="#0d1117" stroke-width="3"/>
  <circle cx="650" cy="310" r="19" fill="url(#verd)" stroke="#0d1117" stroke-width="3"/>
  <circle cx="250" cy="230" r="19" fill="url(#gold)" stroke="#0d1117" stroke-width="3"/>

  <g fill="#e6edf3" font-weight="800" font-size="15">
    <text x="219" y="716" text-anchor="end">EXPLORE</text>
    <text x="682" y="636" text-anchor="start">DISCUSS</text>
    <text x="219" y="556" text-anchor="end">CONTRIBUTE</text>
    <text x="682" y="476" text-anchor="start">COLLABORATE</text>
    <text x="219" y="396" text-anchor="end">RECOGNITION</text>
    <text x="682" y="316" text-anchor="start">TRUST</text>
    <text x="219" y="236" text-anchor="end">MEMBERSHIP ELIGIBILITY</text>
  </g>
  <g fill="#8b949e" font-size="10.5">
    <text x="219" y="733" text-anchor="end">public, no membership needed</text>
    <text x="682" y="653" text-anchor="start">channels, issues, PRs</text>
    <text x="219" y="573" text-anchor="end">first accepted contribution</text>
    <text x="682" y="493" text-anchor="start">deeper, trusted work</text>
    <text x="219" y="413" text-anchor="end">≥ 3 accepted · 1+ month</text>
    <text x="682" y="333" text-anchor="start">sustained + reviewed</text>
    <text x="219" y="253" text-anchor="end">earned, never demanded</text>
  </g>
  <text x="219" y="278" text-anchor="end" fill="#E3C080" font-weight="800" font-size="10" letter-spacing="1">✦ EARNED</text>

  <text x="450" y="772" text-anchor="middle" fill="#6e7681" font-size="11">
    Public all the way up — only the final step touches membership. Contributions are visible before you ever apply.
  </text>
</svg>