<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Hidden Alchemy transformation pipeline</title>
  <desc id="desc">A horizontal pipeline of six stages connecting Idea, Concept, Architecture, System, Automation, and Reality. The static frame is a complete illustration; a slow node-highlight drift is the only animation. Colors are chosen to remain legible on both GitHub light and dark backgrounds.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#BD9C61"/>
    </marker>
  </defs>

  <!-- connectors -->
  <g stroke="#4C6B5C" stroke-opacity="0.7" stroke-width="1.5" fill="none">
    <path d="M118,50 L192,50" marker-end="url(#arrow)"/>
    <path d="M268,50 L342,50" marker-end="url(#arrow)"/>
    <path d="M418,50 L492,50" marker-end="url(#arrow)"/>
    <path d="M568,50 L642,50" marker-end="url(#arrow)"/>
    <path d="M718,50 L792,50" marker-end="url(#arrow)"/>
  </g>

  <!-- stage 1: IDEA -->
  <g>
    <polygon points="120,42 100,76.6 60,76.6 40,42 60,7.4 100,7.4" fill="none" stroke="#BD9C61" stroke-width="1.5"/>
    <circle cx="80" cy="42" r="16" fill="#BD9C61" fill-opacity="0.16">
      <animate attributeName="fill-opacity" values="0.16;0.40;0.16" dur="7s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <rect x="46" y="118" width="68" height="28" rx="5" fill="#0B0B0A" fill-opacity="0.8"/>
    <text x="80" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.5" fill="#F3F0E8">IDEA</text>
  </g>

  <!-- stage 2: CONCEPT -->
  <g>
    <polygon points="270,42 250,76.6 210,76.6 190,42 210,7.4 250,7.4" fill="none" stroke="#4C6B5C" stroke-width="1.5"/>
    <circle cx="230" cy="42" r="16" fill="#BD9C61" fill-opacity="0.16">
      <animate attributeName="fill-opacity" values="0.16;0.40;0.16" dur="7s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <rect x="186" y="118" width="88" height="28" rx="5" fill="#0B0B0A" fill-opacity="0.8"/>
    <text x="230" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.5" fill="#F3F0E8">CONCEPT</text>
  </g>

  <!-- stage 3: ARCHITECTURE -->
  <g>
    <polygon points="420,42 400,76.6 360,76.6 340,42 360,7.4 400,7.4" fill="none" stroke="#4C6B5C" stroke-width="1.5"/>
    <circle cx="380" cy="42" r="16" fill="#BD9C61" fill-opacity="0.16">
      <animate attributeName="fill-opacity" values="0.16;0.40;0.16" dur="7s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="312" y="118" width="136" height="28" rx="5" fill="#0B0B0A" fill-opacity="0.8"/>
    <text x="380" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.5" fill="#F3F0E8">ARCHITECTURE</text>
  </g>

  <!-- stage 4: SYSTEM -->
  <g>
    <polygon points="570,42 550,76.6 510,76.6 490,42 510,7.4 550,7.4" fill="none" stroke="#4C6B5C" stroke-width="1.5"/>
    <circle cx="530" cy="42" r="16" fill="#BD9C61" fill-opacity="0.16">
      <animate attributeName="fill-opacity" values="0.16;0.40;0.16" dur="7s" begin="3.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="490" y="118" width="80" height="28" rx="5" fill="#0B0B0A" fill-opacity="0.8"/>
    <text x="530" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.5" fill="#F3F0E8">SYSTEM</text>
  </g>

  <!-- stage 5: AUTOMATION -->
  <g>
    <polygon points="720,42 700,76.6 660,76.6 640,42 660,7.4 700,7.4" fill="none" stroke="#4C6B5C" stroke-width="1.5"/>
    <circle cx="680" cy="42" r="16" fill="#BD9C61" fill-opacity="0.16">
      <animate attributeName="fill-opacity" values="0.16;0.40;0.16" dur="7s" begin="4.8s" repeatCount="indefinite"/>
    </circle>
    <rect x="622" y="118" width="116" height="28" rx="5" fill="#0B0B0A" fill-opacity="0.8"/>
    <text x="680" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.5" fill="#F3F0E8">AUTOMATION</text>
  </g>

  <!-- stage 6: REALITY -->
  <g>
    <polygon points="870,42 850,76.6 810,76.6 790,42 810,7.4 850,7.4" fill="none" stroke="#BD9C61" stroke-width="1.5"/>
    <circle cx="830" cy="42" r="16" fill="#BD9C61" fill-opacity="0.16">
      <animate attributeName="fill-opacity" values="0.16;0.40;0.16" dur="7s" begin="6s" repeatCount="indefinite"/>
    </circle>
    <rect x="786" y="118" width="88" height="28" rx="5" fill="#0B0B0A" fill-opacity="0.8"/>
    <text x="830" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.5" fill="#F3F0E8">REALITY</text>
  </g>
</svg>