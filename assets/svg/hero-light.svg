<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" font-family="'Inter',-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>Hidden Alchemy pipeline — live trajectory from Idea to Reality, currently locked on Concept</title>
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 H0 V46" fill="none" stroke="#edf0f4" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CBA75F"/>
      <stop offset="1" stop-color="#B8924F"/>
    </linearGradient>
    <linearGradient id="verd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5D8772"/>
      <stop offset="1" stop-color="#3E5C4E"/>
    </linearGradient>
    <radialGradient id="washA" cx="0.42" cy="0.55" r="0.6">
      <stop offset="0" stop-color="rgba(189,156,97,0.16)"/>
      <stop offset="1" stop-color="rgba(189,156,97,0)"/>
    </radialGradient>
    <radialGradient id="washB" cx="0.72" cy="0.3" r="0.5">
      <stop offset="0" stop-color="rgba(76,107,92,0.16)"/>
      <stop offset="1" stop-color="rgba(76,107,92,0)"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1120" height="380" fill="#ffffff"/>
  <rect x="0" y="0" width="1120" height="380" fill="url(#grid)"/>
  <rect x="0" y="0" width="1120" height="380" fill="url(#washA)"/>
  <rect x="0" y="0" width="1120" height="380" fill="url(#washB)"/>

  <g filter="url(#soft)" opacity="0.9">
    <circle cx="330" cy="150" r="46" fill="none" stroke="rgba(189,156,97,0.35)" stroke-width="1"> </circle>
  </g>

  <path d="M130 195 C200 150 250 138 330 150 C410 162 442 186 520 178 C598 170 640 224 720 216 C800 208 830 170 910 172 C966 173 990 128 1045 138"
        fill="none" stroke="#d5dce2" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520 178 C598 170 640 224 720 216 C800 208 830 170 910 172 C966 173 990 128 1045 138"
        fill="none" stroke="#c9d1d9" stroke-width="4" stroke-dasharray="2 12"
        stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-98" dur="13s" repeatCount="indefinite"/>
  </path>
  <path d="M130 195 C200 150 250 138 330 150"
        fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <path d="M330 150 C410 162 442 186 520 178"
        fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M518 174 L515 155 L526 166 Z" fill="#C9A156"/>

  <g filter="url(#glow)">
    <circle r="7" fill="#C9A156"><animateMotion dur="9s" repeatCount="indefinite"
      path="M130 195 C200 150 250 138 330 150 C410 162 442 186 520 178 C598 170 640 224 720 216 C800 208 830 170 910 172 C966 173 990 128 1045 138"/></circle>
    <circle r="5.5" fill="#4C6B5C"><animateMotion dur="9s" begin="3s" repeatCount="indefinite"
      path="M130 195 C200 150 250 138 330 150 C410 162 442 186 520 178 C598 170 640 224 720 216 C800 208 830 170 910 172 C966 173 990 128 1045 138"/></circle>
    <circle r="4.5" fill="#E3C080"><animateMotion dur="9s" begin="6s" repeatCount="indefinite"
      path="M130 195 C200 150 250 138 330 150 C410 162 442 186 520 178 C598 170 640 224 720 216 C800 208 830 170 910 172 C966 173 990 128 1045 138"/></circle>
  </g>

  <circle cx="330" cy="150" r="30" fill="none" stroke="#BD9C61" stroke-width="2">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 330 150" to="360 330 150" dur="7s" repeatCount="indefinite"/>
    <circle cx="330" cy="120" r="2.6" fill="#BD9C61"/>
    <circle cx="330" cy="180" r="2.6" fill="#4C6B5C"/>
  </g>

  <circle cx="130" cy="195" r="14" fill="url(#gold)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="330" cy="150" r="14" fill="url(#verd)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="520" cy="178" r="14" fill="#ffffff" stroke="#b9c2cb" stroke-width="2.5"/>
  <circle cx="720" cy="216" r="14" fill="#ffffff" stroke="#b9c2cb" stroke-width="2.5"/>
  <circle cx="910" cy="172" r="14" fill="#ffffff" stroke="#b9c2cb" stroke-width="2.5"/>
  <circle cx="1045" cy="138" r="14" fill="url(#gold)" stroke="#ffffff" stroke-width="3"/>

  <g text-anchor="middle" fill="#1f2328" font-weight="800" font-size="16">
    <text x="130" y="229">IDEA</text>
    <text x="330" y="184">CONCEPT</text>
    <text x="520" y="212">ARCHITECTURE</text>
    <text x="720" y="250">SYSTEM</text>
    <text x="910" y="206">AUTOMATION</text>
    <text x="1045" y="172">REALITY</text>
  </g>
  <g text-anchor="middle" fill="#6e7781" font-size="10.5">
    <text x="130" y="245">written, submitted</text>
    <text x="330" y="200">shape decided here</text>
    <text x="520" y="228">boundaries fixed</text>
    <text x="720" y="266">a working thing lives</text>
    <text x="910" y="222">repetition removed</text>
    <text x="1045" y="188">used, then archived</text>
  </g>
  <g text-anchor="middle" fill="#9aa4af" font-size="9.5" letter-spacing="3">
    <text x="330" y="220">PHASE LOCK · CONCEPT</text>
  </g>

  <text x="22" y="32" fill="#9aa4af" font-size="10.5" letter-spacing="2">STATUS</text>
  <g>
    <rect x="104" y="20" width="66" height="22" rx="11" fill="url(#verd)"/>
    <circle cx="118" cy="31" r="3.4" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="129" y="35" fill="#ffffff" font-size="10.5" font-weight="700" letter-spacing="1">LIVE</text>
  </g>

  <text x="560" y="352" text-anchor="middle" fill="#9aa4af" font-size="11" letter-spacing="1">
    IDEA → CONCEPT → ARCHITECTURE → SYSTEM → AUTOMATION → REALITY
  </text>
  <rect x="833" y="346" width="2" height="13" fill="#BD9C61">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>